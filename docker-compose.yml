services:
  mongo:
    image: mongo:latest
    container_name: 'mongo_db'
    ports:
      - 27017:27017
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_user
      MONGO_INITDB_ROOT_PASSWORD: mongo_password
    volumes:
      - ./src/main/resources/mongo-init:/docker-entrypoint-initdb.d
